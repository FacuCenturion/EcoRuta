spring.application.name=ecoruta-backend
server.port=${PUERTO:8080}

# Base de datos. Los valores por defecto coinciden con docker-compose.yml;
# en otro entorno se pisan con variables de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecoruta}
spring.datasource.username=${DB_USER:ecoruta}
spring.datasource.password=${DB_PASSWORD:ecoruta}

# El esquema lo manejan las migraciones de Flyway (src/main/resources/db/migration).
# Hibernate solo valida que las entidades coincidan con las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Fechas en ISO 8601 con la zona horaria de Buenos Aires
spring.jackson.time-zone=America/Argentina/Buenos_Aires

# Swagger en /api/docs y el contrato OpenAPI en /api/openapi
springdoc.swagger-ui.path=/api/docs
springdoc.api-docs.path=/api/openapi

management.endpoints.web.exposure.include=health

# Orígenes que pueden llamar a la API desde el navegador (separados por coma)
ecoruta.cors.origenes=${CORS_ORIGENES:http://localhost:5173}
# Clave que mandan el emulador y los sensores en el header X-Api-Key
ecoruta.sensores.api-key=${SENSORES_API_KEY:clave-de-desarrollo}
